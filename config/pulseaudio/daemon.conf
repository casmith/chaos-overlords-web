# PulseAudio daemon settings for the Chaos Overlords container.
#
# The game's sound effects are 8-bit mono 22.05 kHz WAVs -- genuinely low
# fidelity, and nothing here can add detail that was never recorded. What this
# does is stop the path to the browser from making them worse.

# Match Opus, which pcmflux encodes at 48 kHz. With the sink at 48 kHz too,
# audio is resampled exactly once (22.05 -> 48) instead of twice.
default-sample-rate = 48000
alternate-sample-rate = 44100
default-sample-format = s16le
default-sample-channels = 2

# PulseAudio's default is speex-float-1, its lowest quality setting. Upsampling
# 22.05 kHz with it is audibly rough. speex-float-5 is a large improvement and
# the cost is irrelevant here: this is one mono voice on an otherwise idle CPU.
resample-method = speex-float-5

# There is no hardware to keep fed, so latency is not the constraint; a few
# larger fragments are steadier than many small ones under CPU contention.
default-fragments = 4
default-fragment-size-msec = 25

# No hardware, no session integration, nothing to autoload.
flat-volumes = no
