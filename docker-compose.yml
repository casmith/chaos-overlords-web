# Chaos Overlords -- two-player reference deployment.
#
#   cp .env.example .env      # then point GAME_PATH at your game files
#   docker compose build
#   docker compose up -d
#
# Then open https://<docker-host>:8081 for player 1 and :8082 for player 2.
# Video, audio, mouse and keyboard all ride that single port.
#
# HTTPS, on a self-signed certificate, because the browser client needs a secure
# context to run anywhere but localhost. Your browser will warn once. Set
# ENABLE_HTTPS=false only when a reverse proxy terminates TLS in front.
#
# The streaming port is unauthenticated unless WEB_PASSWORD is set. Keep it on a
# trusted network, or put a VPN or authenticating reverse proxy in front.

services:

  chaos1:
    build: .
    image: chaos-overlords:latest
    container_name: chaos1
    hostname: chaos1
    restart: unless-stopped
    # Wine is given time to close the game and flush saves before anything is
    # killed. Docker's 10s default is not enough.
    stop_grace_period: 30s
    environment:
      GAME_EXE: ${GAME_EXE:-}
      GAME_ARGS: ${GAME_ARGS:-}
      DISPLAY_WIDTH: ${DISPLAY_WIDTH:-640}
      DISPLAY_HEIGHT: ${DISPLAY_HEIGHT:-480}
      DISPLAY_DEPTH: ${DISPLAY_DEPTH:-24}
      WINE_WINDOWS_VERSION: ${WINE_WINDOWS_VERSION:-win98}
      WINE_VIRTUAL_DESKTOP: ${WINE_VIRTUAL_DESKTOP:-true}
      PATCH_DIALOG_VISIBILITY: ${PATCH_DIALOG_VISIBILITY:-true}
      # Sleep instead of spinning the message loop; see docs/cpu-findings.md.
      WINE_YIELD_SLEEP_US: ${WINE_YIELD_SLEEP_US:-500}
      ENABLE_AUDIO: ${ENABLE_AUDIO:-true}
      VIDEO_ENCODER: ${VIDEO_ENCODER:-h264enc}
      VIDEO_FPS: ${VIDEO_FPS:-30}
      VIDEO_BITRATE: ${VIDEO_BITRATE:-2000}
      # 4:4:4 chroma; see docs/video-findings.md.
      VIDEO_FULLCOLOR: ${VIDEO_FULLCOLOR:-true}
      AUDIO_BITRATE: ${AUDIO_BITRATE:-96000}
      ENABLE_HTTPS: ${ENABLE_HTTPS:-true}
      WEB_USER: ${WEB_USER:-player}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      ENABLE_VNC: ${ENABLE_VNC:-false}
      TZ: ${TZ:-America/Chicago}
      DEBUG: ${DEBUG:-false}
    volumes:
      # Game files: read-only, supplied by you, never part of the image.
      - ${GAME_PATH:-./chaos}:/game:ro
      # Per-player Wine prefix, saves and state.
      - chaos1-config:/config
    ports:
      - "${CHAOS1_WEB_PORT:-8081}:8080"
    networks:
      - chaos-net
    security_opt:
      - no-new-privileges:true

  chaos2:
    build: .
    image: chaos-overlords:latest
    container_name: chaos2
    hostname: chaos2
    restart: unless-stopped
    # Wine is given time to close the game and flush saves before anything is
    # killed. Docker's 10s default is not enough.
    stop_grace_period: 30s
    environment:
      GAME_EXE: ${GAME_EXE:-}
      GAME_ARGS: ${GAME_ARGS:-}
      DISPLAY_WIDTH: ${DISPLAY_WIDTH:-640}
      DISPLAY_HEIGHT: ${DISPLAY_HEIGHT:-480}
      DISPLAY_DEPTH: ${DISPLAY_DEPTH:-24}
      WINE_WINDOWS_VERSION: ${WINE_WINDOWS_VERSION:-win98}
      WINE_VIRTUAL_DESKTOP: ${WINE_VIRTUAL_DESKTOP:-true}
      PATCH_DIALOG_VISIBILITY: ${PATCH_DIALOG_VISIBILITY:-true}
      # Sleep instead of spinning the message loop; see docs/cpu-findings.md.
      WINE_YIELD_SLEEP_US: ${WINE_YIELD_SLEEP_US:-500}
      ENABLE_AUDIO: ${ENABLE_AUDIO:-true}
      VIDEO_ENCODER: ${VIDEO_ENCODER:-h264enc}
      VIDEO_FPS: ${VIDEO_FPS:-30}
      VIDEO_BITRATE: ${VIDEO_BITRATE:-2000}
      # 4:4:4 chroma; see docs/video-findings.md.
      VIDEO_FULLCOLOR: ${VIDEO_FULLCOLOR:-true}
      AUDIO_BITRATE: ${AUDIO_BITRATE:-96000}
      ENABLE_HTTPS: ${ENABLE_HTTPS:-true}
      WEB_USER: ${WEB_USER:-player}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      ENABLE_VNC: ${ENABLE_VNC:-false}
      TZ: ${TZ:-America/Chicago}
      DEBUG: ${DEBUG:-false}
    volumes:
      - ${GAME_PATH:-./chaos}:/game:ro
      - chaos2-config:/config
    ports:
      - "${CHAOS2_WEB_PORT:-8082}:8080"
    networks:
      - chaos-net
    security_opt:
      - no-new-privileges:true

networks:
  chaos-net:
    name: chaos-net

volumes:
  chaos1-config:
  chaos2-config:
