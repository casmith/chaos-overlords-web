name: Build and publish images

# Publishes the two images this project deploys:
#
#   ghcr.io/<owner>/chaos-overlords          the game container (Wine + Selkies)
#   ghcr.io/<owner>/chaos-overlords-manager  the session manager
#
# Neither contains game files. The game image mounts them read-only at run time
# from a path the operator supplies, so publishing these publicly ships no
# copyrighted material -- see docs/game-files.md.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'SPEC.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'SPEC.md'
  workflow_dispatch:

concurrency:
  # One build per ref. A newer push makes an in-flight build of the same branch
  # pointless, and these are slow: the game image is ~4 GB.
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Refuse to build if anything that looks like game content is tracked.
  #
  # This exists because it happened: `git add -A` swept a 7 MB chaos.zip and a
  # stray file named after an IP address into a public commit. .gitignore now
  # covers both, but .gitignore only protects against files nobody has added --
  # it does nothing once something is tracked, and nothing at all if a future
  # pattern misses. This checks the actual tree.
  guard:
    name: No game content in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files
        run: |
          BAD=$(git ls-files | grep -iE \
            '\.(zip|7z|rar|tar|tar\..*|iso|exe|dll|ogg|wav|bin|cue)$|^chaos/|^game/|^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' \
            || true)
          if [ -n "$BAD" ]; then
            echo "::error::Game content or archives are tracked in this repository."
            echo "$BAD"
            echo
            echo "The game is copyrighted and this repository is public."
            echo "Untrack it, add it to .gitignore, and rewrite the commit that added it."
            exit 1
          fi
          echo "clean: no archives, binaries or game directories tracked"

  build:
    needs: guard
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chaos-overlords
            context: .
            dockerfile: Dockerfile
            # ~4 GB: Debian, a 32-bit Wine, and Selkies' Python tree.
            reclaim_disk: true
          - name: chaos-overlords-manager
            context: ./manager
            dockerfile: manager/Dockerfile
            reclaim_disk: false

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The game image plus its Selkies build stage does not fit beside the
      # runner's preinstalled toolchains. Reclaiming this takes about a minute
      # and buys ~25 GB.
      - name: Reclaim runner disk space
        if: matrix.reclaim_disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          echo "after:"; df -h / | tail -1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped for pull requests: a PR must build, but it must not publish,
      # and a fork's token cannot write packages anyway.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # linux/amd64 only, deliberately: the game is a 32-bit x86 Windows
          # binary, so an arm64 image would have nothing to run (SPEC 38).
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
